# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
# lotus-share: nguồn apt arm64 ở ports.ubuntu.com (archive.ubuntu.com chỉ có amd64/i386); dựng bằng requirements-arm64.txt.
version: 1
script:
  # Workaround for error in Github Actions (https://github.com/AppImageCrafters/appimage-builder/issues/271)
  - which mksquashfs || apt install squashfs-tools
  - install -Dm644 support/build/appimage/com.tsudev.lotusshare.desktop AppDir/usr/share/applications/com.tsudev.lotusshare.desktop

AppDir:
  path: AppDir
  app_info:
    id: com.tsudev.lotusshare
    name: Lotus Share
    icon: lotus-share
    version: 1.18.2
    exec: lotus_share
    exec_args: $@
  apt:
    arch:
      - arm64
    allow_unauthenticated: true
    sources:
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy universe
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-updates universe
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy multiverse
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-updates multiverse
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-backports main restricted universe multiverse
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-security universe
      - sourceline: deb http://ports.ubuntu.com/ubuntu-ports/ jammy-security multiverse
    include:
      - libayatana-appindicator3-1:arm64
      - librsvg2-common:arm64
    exclude:
      - adwaita-icon-theme:*
  runtime:
    env:
      XDG_DATA_DIRS: '/usr/local/share/:/usr/share/:${XDG_DATA_DIRS}'
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

# Test cases do not work in Github Actions
#
#  test:
#    fedora-30:
#      image: appimagecrafters/tests-env:fedora-30
#      command: ./AppRun
#    debian-stable:
#      image: appimagecrafters/tests-env:debian-stable
#      command: ./AppRun
#    archlinux-latest:
#      image: appimagecrafters/tests-env:archlinux-latest
#      command: ./AppRun
#    centos-7:
#      image: appimagecrafters/tests-env:centos-7
#      command: ./AppRun
#    ubuntu-xenial:
#      image: appimagecrafters/tests-env:ubuntu-xenial
#      command: ./AppRun
AppImage:
  arch: aarch64  # lotus-share: tên runtime AppImageKit là runtime-aarch64 (runtime-arm_64 không tồn tại)
  file_name: !ENV 'lotus-share-${APP_VERSION}-linux-arm-64.AppImage'
  update-information: gh-releases-zsync|tsudev-org|lotus-share|latest|lotus-share-*-linux-arm-64.AppImage.zsync
