# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
script:
  # Workaround for error in Github Actions (https://github.com/AppImageCrafters/appimage-builder/issues/271)
  - which mksquashfs || apt install squashfs-tools
  - install -Dm644 support/build/appimage/com.tsudev.lotusshare.desktop AppDir/usr/share/applications/com.tsudev.lotusshare.desktop

AppDir:
  path: AppDir
  app_info:
    id: com.tsudev.lotusshare
    name: Lotus Share
    icon: lotus-share
    version: 26.11.1901
    exec: lotus_share
    exec_args: $@
  apt:
    arch:
      - amd64
    # lotus-share: kho Ubuntu kiểm chữ ký bằng khóa ghim trong repo (Ubuntu Archive Automatic Signing Key 2018,
    # F6EC B376 2474 EDA9 D21B  7022 8719 20D1 991B C93C). @THU_MUC_REPO@ do release-lotus.yml thay lúc dựng.
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy main restricted
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy universe
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates universe
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy multiverse
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates multiverse
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://security.ubuntu.com/ubuntu/ jammy-security main restricted
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://security.ubuntu.com/ubuntu/ jammy-security universe
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
      - sourceline: deb http://security.ubuntu.com/ubuntu/ jammy-security multiverse
        key_url: file://@THU_MUC_REPO@/support/build/appimage/ubuntu-archive-keyring-2018.public.key
    include:
      - libayatana-appindicator3-1:amd64
      - librsvg2-common:amd64
    exclude:
      - adwaita-icon-theme:*
  runtime:
    env:
      XDG_DATA_DIRS: '/usr/local/share/:/usr/share/:${XDG_DATA_DIRS}'
  files:
    include: []
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*

# Test cases do not work in Github Actions
#
#  test:
#    fedora-30:
#      image: appimagecrafters/tests-env:fedora-30
#      command: ./AppRun
#    debian-stable:
#      image: appimagecrafters/tests-env:debian-stable
#      command: ./AppRun
#    archlinux-latest:
#      image: appimagecrafters/tests-env:archlinux-latest
#      command: ./AppRun
#    centos-7:
#      image: appimagecrafters/tests-env:centos-7
#      command: ./AppRun
#    ubuntu-xenial:
#      image: appimagecrafters/tests-env:ubuntu-xenial
#      command: ./AppRun
AppImage:
  arch: x86_64
  file_name: !ENV 'lotus-share-${APP_VERSION}-linux-x86-64.AppImage'
  update-information: gh-releases-zsync|tsudev-org|lotus-share|latest|lotus-share-*-linux-x86-64.AppImage.zsync
