<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d">
  <title id="t">tsudev-lotus trong mạng nội bộ</title>
  <desc id="d">Điện thoại và máy tính xách tay nối với nhau qua bộ phát Wi-Fi; đường truyền có biểu tượng khóa, Internet bị gạch bỏ.</desc>
  <rect width="640" height="420" rx="12" fill="#EEF4FB"/>
  <!-- Bộ phát Wi-Fi -->
  <g transform="translate(320 92)">
    <path d="M-44 0a62 62 0 0 1 88 0" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <path d="M-27 17a38 38 0 0 1 54 0" fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="36" r="8" fill="#2563EB"/>
    <text x="0" y="74" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#44607C">Cùng mạng Wi-Fi / LAN</text>
  </g>
  <!-- Điện thoại -->
  <g transform="translate(70 170)">
    <rect width="104" height="190" rx="16" fill="#FFFFFF" stroke="#1C2B3A" stroke-width="4"/>
    <rect x="14" y="22" width="76" height="132" rx="6" fill="#DCE8F7"/>
    <rect x="28" y="52" width="48" height="60" rx="5" fill="#2563EB"/>
    <path d="M40 92l12-14 10 10 6-6 10 14z" fill="#FFFFFF"/>
    <circle cx="52" cy="172" r="7" fill="#C9D9EC"/>
  </g>
  <!-- Máy tính -->
  <g transform="translate(410 190)">
    <rect x="10" width="170" height="112" rx="8" fill="#FFFFFF" stroke="#1C2B3A" stroke-width="4"/>
    <rect x="24" y="14" width="142" height="84" rx="4" fill="#DCE8F7"/>
    <path d="M70 34h36l14 14v34H70z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <path d="M0 122h190l-12 18H12z" fill="#1C2B3A"/>
  </g>
  <!-- Đường truyền + khóa -->
  <path d="M190 262 C 270 230, 340 230, 405 248" fill="none" stroke="#2563EB" stroke-width="5" stroke-dasharray="12 9" stroke-linecap="round"/>
  <path d="M392 236l16 12-18 8" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(296 212)">
    <rect x="-22" y="0" width="44" height="34" rx="6" fill="#1C2B3A"/>
    <path d="M-12 0v-10a12 12 0 0 1 24 0v10" fill="none" stroke="#1C2B3A" stroke-width="6"/>
    <circle cx="0" cy="16" r="5" fill="#FFFFFF"/>
  </g>
  <text x="296" y="318" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1C2B3A">HTTPS, xác thực hai chiều</text>
  <!-- Internet bị gạch -->
  <g transform="translate(560 70)">
    <circle r="30" fill="none" stroke="#44607C" stroke-width="4"/>
    <ellipse rx="13" ry="30" fill="none" stroke="#44607C" stroke-width="3"/>
    <path d="M-30 0h60" stroke="#44607C" stroke-width="3"/>
    <path d="M-36 36L36 -36" stroke="#B42318" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="56" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#44607C">Không cần Internet</text>
  </g>
</svg>
