# lotus-share: tự động đề xuất PR nâng cấp phụ thuộc (bản vá bảo mật). Mỗi tháng một PR cho mỗi hệ sinh thái.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    # flutter_rust_bridge: crate Rust + gói Dart + mã sinh phải cùng một bản (test frb_version_test) - nâng tay cả ba.
    ignore:
      - dependency-name: flutter_rust_bridge
      # webrtc >= 0.15 viết lại API (packages/core/src/webrtc) - nâng tay trong task riêng.
      - dependency-name: webrtc
        versions: [">=0.15"]
      # tokio-cron-scheduler >= 0.14 kéo chrono-tz 0.10.4 (RUSTSEC-2026-0555) - chờ bản kéo chrono-tz đã vá.
      - dependency-name: tokio-cron-scheduler
        versions: [">=0.14"]
    # Chỉ gom minor/patch; bản major mở PR riêng từng gói (19/11/2026: #82/#83 gộp major hàng loạt => đỏ, không gộp được).
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    # flutter_rust_bridge: crate Rust + gói Dart + mã sinh phải cùng một bản (test frb_version_test) - nâng tay cả ba.
    ignore:
      - dependency-name: flutter_rust_bridge
      # test >= 1.32 cần test_api 0.7.14+, flutter_test của Flutter ghim (.fvmrc) khóa 0.7.12 => không giải được (#65, #90).
      # Nâng cùng lúc nâng Flutter.
      - dependency-name: test
        versions: [">=1.32"]
      # pasteboard đang dùng bản git vá (dependency_overrides trong app/pubspec.yaml) - bỏ bản vá là task riêng.
      - dependency-name: pasteboard
    # Chỉ gom minor/patch; bản major mở PR riêng từng gói (19/11/2026: #82/#83 gộp major hàng loạt => đỏ, không gộp được).
    groups:
      pub:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
  # lotus-share: ảnh gốc ghim digest ở server/Dockerfile (Scorecard Pinned-Dependencies).
  - package-ecosystem: docker
    directory: /server
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
