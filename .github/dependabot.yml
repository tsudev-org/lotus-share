# tsudev-lotus: tự động đề xuất PR nâng cấp phụ thuộc (bản vá bảo mật). Mỗi tháng một PR cho mỗi hệ sinh thái.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: pub
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      pub:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly, timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
