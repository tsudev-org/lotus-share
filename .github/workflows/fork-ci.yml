# tsudev-lotus: kiểm tra riêng của bản fork - bản dịch tiếng Việt, mã dịch sinh tự động khớp nguồn,
# và cổng kiểm quy ước tsudev. (Phân tích/test Dart + Rust của upstream nằm ở ci.yml.)
name: Kiểm tra bản fork

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: Bản dịch tiếng Việt + mã sinh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Phải khớp .fvmrc và commit submodule support/submodules/flutter.
      FLUTTER_VERSION: '3.47.9'
      FLUTTER_COMMIT: 'c197ca5199e9ee5661e865596c9c07294dfab51c'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Kiểm bản dịch tiếng Việt
        run: python3 -I tools/check_i18n_vi.py
      - name: Cài Flutter (ghim tag + đối chiếu commit, không dùng action bên thứ ba)
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Sinh lại mã dịch và đối chiếu
        working-directory: app
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          dart run slang
          python3 -I ../tools/fix_slang_format.py
          git diff --exit-code -- lib/gen || { echo "::error::app/lib/gen lệch nguồn JSON - chạy 'dart run slang' rồi commit"; exit 1; }

  standards:
    name: Cổng kiểm quy ước tsudev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Bản sao quy ước không bị sửa
        run: ./scripts/sync-standards.sh --check
      # Còn TRƯỢT mục 4 (em-dash) vì mã + bản dịch kế thừa upstream; quy ước v3.2.0 chưa có cơ chế miễn trừ
      # (xem AGENTS.md mục B.4). Bỏ continue-on-error khi tsudev-standards có miễn trừ cho mã upstream.
      - name: Cổng kiểm quy ước
        continue-on-error: true
        run: ./scripts/check-standards.sh

  website:
    name: Website lotus.tsudev.com (build + kiểm tra)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # --ignore-scripts: không chạy script cài đặt của gói npm (chặn mã độc chuỗi cung ứng lúc cài).
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
