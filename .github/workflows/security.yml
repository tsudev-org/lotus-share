# lotus-share: cổng kiểm bảo mật - phân tích tĩnh (CodeQL cho Rust + GitHub Actions), quét lộ bí mật (gitleaks),
# soát lỗ hổng phụ thuộc Rust + Dart (OSV.dev). Mọi action ghim theo SHA commit; quyền token ở mức tối thiểu.
name: Bảo mật

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * 1'   # 09:23 thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    # Repo riêng tư cần GitHub Advanced Security để tải kết quả CodeQL; tự bật khi repo công khai.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}

  secrets:
    name: Quét lộ bí mật (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Ghim phiên bản + checksum. Không dùng gitleaks-action (đòi GITLEAKS_LICENSE khi repo thuộc Organization).
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tải gitleaks (ghim phiên bản, kiểm checksum)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      # Quét toàn lịch sử. Khóa thử nghiệm công khai của upstream được miễn theo dấu vân tay trong .gitleaksignore.
      - name: Quét toàn lịch sử git
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --ignore-gitleaks-allow --no-banner --exit-code 1 .

  dependencies:
    name: Lỗ hổng phụ thuộc (Rust + Dart, OSV)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 -I tools/osv_scan.py
