display_name: Lotus Share
package_name: lotus-share
maintainer:
  name: tsudev
  email: noreply@tsudev.com
priority: optional
section: x11
installed_size: 30600
essential: false
icon: assets/img/logo-512.png

pre_dependencies:
  - libc6 (>= 2.34)

dependencies:
  - libappindicator3-1 | libayatana-appindicator3-1
  - gir1.2-appindicator3-0.1 | gir1.2-ayatanaappindicator3-0.1
  - libayatana-ido3-0.4-0
  - libegl1
  - libgles2
  - xdg-user-dirs

postinstall_scripts:
  - echo "Đã cài Lotus Share"
postuninstall_scripts:
  - if [ "$1" = "remove" ]; then echo "Đã gỡ Lotus Share"; fi

keywords:
  - Sharing
  - LAN
  - Files

generic_name: Chia sẻ tệp trong mạng nội bộ

categories:
  - GTK
  - FileTransfer
  - Utility

startup_notify: true

# Must match the GTK application id set in linux/CMakeLists.txt, otherwise the
# desktop environment cannot map the running window back to this desktop entry.
startup_wm_class: com.tsudev.lotusshare
